name: 3D mechanics verification
# Author: Athul Prem | _AP_pnc
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-cpu:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements_3d_AP_pnc.txt
            requirements_ui_AP_pnc.txt
      - name: Install numerical and desktop test environment
        run: python -m pip install -r requirements_ui_AP_pnc.txt
      - name: Scientific, workflow and offscreen desktop tests
        run: python -B -m unittest discover -s tests -p 'test*_AP_pnc.py' -v
      - name: Three-mesh convergence and fixed-property temperature control
        run: python -B tools/validate_3d_AP_pnc.py
      - name: Matched-port power and phase acceptance
        run: python -B tools/validate_scattering_AP_pnc.py --acceptance --output-dir results/ci-scattering
      - name: Gmsh two-hole power convergence
        run: python -B tools/validate_perforated_AP_pnc.py --output-dir results/ci-perforated --verification-dir results/ci-perforated/evidence
      - name: Saved two-hole complex-response refinement
        run: python -B tools/check_phase_refinement_AP_pnc.py
      - name: Preserved full-device sensitivity evidence (not convergence acceptance)
        run: python -B tools/check_device_refinement_AP_pnc.py
      - name: Saved device and independent port follow-up integrity
        run: python -B tools/check_device_followup_AP_pnc.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: numerical-verification
          path: |
            verification/straight_beam_validation_AP_pnc.json
            verification/straight_beam_validation_AP_pnc.csv
            results/ci-scattering/straight_scattering_acceptance_AP_pnc.json
            results/ci-scattering/straight_scattering_acceptance_AP_pnc.csv
            results/ci-perforated/evidence/two_hole_scattering_validation_AP_pnc.json
            results/ci-perforated/evidence/two_hole_scattering_validation_AP_pnc.csv
